name: Verify HilltopAds, clean site and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: HilltopAds read-only sync
        env:
          HILLTOPADS_API_KEY: ${{ secrets.HILLTOPADS_API_KEY }}
        run: python3 hilltopads_chatgpt_bridge.py
      - name: Commit public sync status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hilltopads_status.json
          git diff --staged --quiet || git commit -m 'Update HilltopAds read-only status'
          git push || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
